<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartIntern — Reset Password</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
    >


    <!-- Existing CSS -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <link
        rel="stylesheet"
        href="../css/autofill-fix.css"
    >

    <link
        rel="stylesheet"
        href="../css/reset-password.css"
    >

</head>


<body class="login-page">


    <!-- Soft Background -->

    <div class="signup-bg bg-one"></div>

    <div class="signup-bg bg-two"></div>


    <!-- Subtle 3D -->

    <canvas id="threeCanvas"></canvas>


    <!-- =====================================================
         RESET PASSWORD
    ====================================================== -->

    <main class="signup-wrapper">

        <section class="signup-card login-card">


            <!-- Heading -->

            <div class="signup-heading">

                <h1>
                    Create a
                    <em>new password.</em>
                </h1>

                <p>
                    Enter your new password below.
                </p>

            </div>


            <!-- Form -->

            <form
                id="resetPasswordForm"
                novalidate
            >


                <!-- New Password -->

                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                        >
                            Show
                        </button>

                    </div>

                    <span
                        class="error"
                        id="newPasswordError"
                    ></span>

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                    <span
                        class="error"
                        id="confirmPasswordError"
                    ></span>

                </div>


                <!-- Reset Button -->

                <button
                    type="submit"
                    class="signup-button"
                >

                    <span>
                        Reset Password
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>


                <!-- Back -->

                <p class="login-text">

                    Remember your password?

                    <a href="login.html">
                        Back to Login
                    </a>

                </p>

            </form>

        </section>

    </main>


    <!-- Three.js -->



    <!-- GSAP -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>


    <!-- JS -->

    <script src="../js/api.js"></script>

    <script src="../js/reset-password.js"></script>

</body>
</html>
