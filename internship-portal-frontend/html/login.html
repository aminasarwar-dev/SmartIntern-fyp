<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartIntern — Login</title>

    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
    >

    <!-- =========================
         CSS
    ========================== -->

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">

    <!-- Keep this if you already have it -->
    <link rel="stylesheet" href="../css/autofill-fix.css">
    <link rel="stylesheet" href="../css/forgot-password.css">

</head>


<body class="login-page">

    <!-- BACK TO HOME -->
    <a href="index.html" class="page-back">
        <span aria-hidden="true">←</span> Back to home
    </a>



    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="signup-bg bg-one"></div>

    <div class="signup-bg bg-two"></div>


    <!-- =========================
         THREE.JS
    ========================== -->

    <canvas id="threeCanvas"></canvas>


    <!-- =========================
         LOGIN
    ========================== -->

    <main class="signup-wrapper">

        <section class="signup-card login-card">


            <!-- Heading -->

            <div class="signup-heading">

                <h1>

                    Welcome

                    <em>
                        back.
                    </em>

                </h1>

            </div>


            <!-- Role -->

            <div class="role-switch">

                <button
                    type="button"
                    class="role-option active"
                    data-role="student"
                >
                    Student
                </button>


                <button
                    type="button"
                    class="role-option"
                    data-role="company"
                >
                    Company
                </button>

            </div>


            <!-- Login Form -->

            <form
                id="loginForm"
                novalidate
            >

                <input
                    type="hidden"
                    id="accountRole"
                    value="student"
                >


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <span
                        class="error"
                        id="emailError"
                    ></span>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            Show
                        </button>

                    </div>

                    <span
                        class="error"
                        id="passwordError"
                    ></span>

                </div>


                <!-- Remember / Forgot -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        class="forgot-password"
                        id="forgotPasswordLink"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    id="loginButton"
                    type="submit"
                    class="signup-button"
                >

                    <span>
                        Login
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>


                <!-- Create Account -->

                <p class="login-text">

                    Don't have an account?

                    <a href="profile-setup.html">
                        Create account
                    </a>

                </p>

            </form>

        </section>

    </main>



    <!-- =========================
         SUCCESS OVERLAY
    ========================== -->

    <div
        class="success-overlay"
        id="successOverlay"
    >

        <div class="success-box">

            <div class="success-mark">
                ✓
            </div>

            <h2>
                Welcome Back
            </h2>

            <p>
                You are successfully logged in.
            </p>

            <button
                id="continueBtn"
                class="signup-button"
            >

                <span>
                    Continue
                </span>

                <span class="button-arrow">
                    →
                </span>

            </button>

        </div>

    </div>



    <!-- =========================
         FORGOT PASSWORD MODAL
    ========================== -->

    <div
        class="forgot-modal"
        id="forgotPasswordModal"
    >

        <div class="forgot-modal-box">


            <button
                type="button"
                class="forgot-modal-close"
                id="forgotModalClose"
            >
                ×
            </button>


            <div class="forgot-modal-heading">

                <h2>
                    Forgot
                    <em>password?</em>
                </h2>

                <p>
                    Enter your registered email address.
                </p>

            </div>


            <form
                id="forgotPasswordForm"
                novalidate
            >

                <div class="input-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <span
                        class="error"
                        id="forgotEmailError"
                    ></span>

                </div>


                <button
                    type="submit"
                    class="signup-button"
                >

                    <span>
                        Continue
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>

        </div>

    </div>



    <!-- =========================
         LIBRARIES
    ========================== -->


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>


    <!-- =========================
         YOUR JS
    ========================== -->

    <script src="../js/api.js"></script>

    <script src="../js/login.js"></script>


</body>

</html>
